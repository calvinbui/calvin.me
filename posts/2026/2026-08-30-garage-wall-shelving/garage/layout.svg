<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" style="--background:#f7f8fa;--floor:#ffffff;--text:#17212b;--muted:#5d6975;--grid:#dce2e7;--dimension:#7a8793;--dot-dab:#347d7b;--cavity:#7657a6;--bare-brick:#b65c42;--shelf:#2e6fb0;--shelf-fill:#dceaf7" viewBox="0 0 1400 1470"><title id="title">Top-down layout of the garage walls and eight wall-mounted shelves</title><desc id="description">A 5.58 metre by 3.25 metre single-car garage. Three shelves run along each long wall, with one shelf on the study wall and one on the garage-door wall. The outside wall is on the left and the foyer wall is on the right. Both are plasterboard dot-and-dabbed to brick. The study wall has plasterboard and a cavity in front of brick veneer, and the garage-door wall is bare brick.</desc><style>@media (prefers-color-scheme:dark){:root{--background:#151a1f;--floor:#1d242b;--text:#f1f4f6;--muted:#aeb8c2;--grid:#36414b;--dimension:#8996a2;--dot-dab:#68b8b5;--cavity:#ad8cd7;--bare-brick:#e18b70;--shelf:#72abe0;--shelf-fill:#243e56}}text{fill:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.dimension{fill:var(--muted)}.wall-label{font-size:23px;font-weight:600;letter-spacing:1.1px}.wall-detail{font-size:21px}.dimension{font-size:22px;font-weight:600}</style><defs><pattern id="floor-grid" width="55" height="55" patternUnits="userSpaceOnUse"><path fill="none" stroke="var(--grid)" d="M55 0H0v55"/></pattern><pattern id="shelf-mesh" width="18" height="18" patternUnits="userSpaceOnUse"><path fill="var(--shelf-fill)" d="M0 0h18v18H0z"/><path fill="none" stroke="var(--shelf)" stroke-width="1.5" d="M18 0H0v18" opacity=".6"/></pattern><marker id="arrow-start" markerHeight="8" markerWidth="8" orient="auto" refX="4" refY="4"><path fill="none" stroke="var(--dimension)" stroke-width="1.5" d="M8 0 0 4l8 4"/></marker><marker id="arrow-end" markerHeight="8" markerWidth="8" orient="auto" refX="4" refY="4"><path fill="none" s